<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#354f38">
  <title>Graces Digital | Card 006</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/icon Preto" type="image/svg+xml">
</head>
<body>
  <div class="ambient ambient--green"></div>
  <div class="ambient ambient--sage"></div>

  <main class="card">
    <div class="paper-grain" aria-hidden="true"></div>
    <header class="hero">
      <div class="pattern pattern--top" aria-hidden="true"></div>
      <div class="portrait-frame">
        <span class="portrait-glow"></span>
        <img src="assets/perfil.png" alt="Foto de perfil" class="portrait">
      </div>
      <h1>GRACES<br><span>DIGITAL</span></h1>
      <p class="profession">NUTRICIONISTA</p>
      <div class="hero-leaf hero-leaf--left" aria-hidden="true"></div>
      <div class="hero-leaf hero-leaf--right" aria-hidden="true"></div>
    </header>

    <section class="links" aria-label="Links de contato">
      <a class="link-pill" href="https://SEU-LINK-DE-AGENDAMENTO.com" target="_blank" rel="noopener noreferrer">
        <span class="link-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M7 2.5v4M17 2.5v4M3 9h18M8 14l2.5 2.5L16 11"/></svg></span>
        <span>Agendamento</span><span class="link-arrow">↗</span>
      </a>
      <a class="link-pill" href="https://www.instagram.com/digitalgraces/" target="_blank" rel="noopener noreferrer">
        <span class="link-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg></span>
        <span>Instagram</span><span class="link-arrow">↗</span>
      </a>
      <a class="link-pill" href="https://wa.me/5500000000000" target="_blank" rel="noopener noreferrer">
        <span class="link-icon"><svg viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20.5l1.5-5.1A8.5 8.5 0 1 1 20.5 11.5Z"/><path d="M8.3 8.3c.3-.4.7-.5 1-.1l1 1.6c.2.4-.1.7-.5 1.1 1 1.9 2 2.7 3.8 3.5.4-.4.8-.7 1.2-.5l1.6.9c.5.3.4.8.1 1.2-.8 1-2.3.8-3.8 0-2.2-1.2-4.3-3.3-5.2-5.6-.5-1.2-.3-2.1.8-2.9Z"/></svg></span>
        <span>Contato</span><span class="link-arrow">↗</span>
      </a>
    </section>

    <p class="instruction">CLIQUE NOS ÍCONES PARA INTERAGIR</p>
    <footer></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
